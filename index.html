<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Expense Calculator</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">

        <h1 class="title">Calculate your daily <br>expenses</h1>
        <main>
            <div class="enter-text-div">
                <input class="ex-type" type="text" placeholder="your expenses">
                <input class="ex-price" type="text" placeholder="amount" >
            <input class="add-button" type="button" value="add">    
            </div>
            <input class="calculate-button" type="button" value="calculate">
        </main>
        <div class="final-div">
            <label class="text-total-label"></label>
            <label class="total-label"></label>
        </div>
    </div>
    <div class="list-items-div">
        <h1 class="title-items">items</h1>
    </div>
<script src="index.js"></script>
</body>
</html>
